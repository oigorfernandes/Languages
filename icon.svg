<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Colombian flag stripes: yellow (½), blue (¼), red (¼) -->
  <rect width="512" height="256" fill="#FCD116" clip-path="url(#round)"/>
  <rect y="256" width="512" height="128" fill="#003893" clip-path="url(#round)"/>
  <rect y="384" width="512" height="128" fill="#CE1126" clip-path="url(#round)"/>

  <!-- Semi-transparent overlay behind text for readability -->
  <rect x="0" y="140" width="512" height="240" fill="rgba(0,0,0,0.28)" clip-path="url(#round)"/>

  <!-- "Chimba" title -->
  <text x="256" y="252"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="118" font-weight="800"
        fill="white" text-anchor="middle" dominant-baseline="middle"
        filter="url(#shadow)">Chimba</text>

  <!-- "PT → ES" subtitle -->
  <text x="256" y="340"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="52" font-weight="600"
        fill="rgba(255,255,255,0.88)" text-anchor="middle" dominant-baseline="middle"
        letter-spacing="2">PT → ES</text>
</svg>
