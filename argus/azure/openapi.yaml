openapi: 3.0.1
info:
  title: Argus Full
  description: >-
    Leitura completa de entregas criativas para revisão ortográfica: texto vivo,
    texto dentro de artes e texto dentro de vídeos (quadro a quadro, com os
    quadros exportados). Gera também o relatório Word no padrão da ACD.
  version: "1.0"

servers:
  - url: https://REPLACE-WITH-YOUR-HOST/api

paths:
  /extract:
    post:
      operationId: ExtractAllText
      summary: Extrai todo o texto de um arquivo, incluindo artes e quadros de vídeo
      description: >-
        Abre PPTX, PDF, DOCX ou XLSX; extrai o texto vivo com localização;
        fatia os vídeos embutidos em quadros e lê cada quadro por OCR literal.
        Devolve cada trecho com sua localização, o timecode quando vem de vídeo
        e o link do quadro exportado para conferência humana.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_url, file_name]
              properties:
                file_url:
                  type: string
                  description: URL do arquivo anexado pelo usuário
                file_name:
                  type: string
                  description: Nome do arquivo com extensão, ex. deck.pptx
      responses:
        "200":
          description: Texto extraído
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  file_name: { type: string }
                  format: { type: string }
                  inventory:
                    type: object
                    description: Contagens da peça (slides, páginas, vídeos, imagens)
                  coverage_notes:
                    type: array
                    description: O que NÃO pôde ser verificado. Sempre reporte no relatório.
                    items: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          description: Texto literal, exatamente como está na peça
                        location:
                          type: string
                          description: Slide 5, Página 12, Aba Resumo · B14
                        source:
                          type: string
                          enum: [live, artwork, video]
                        timecode:
                          type: string
                          description: Tempo no vídeo, ex. ~00:06
                        asset_url:
                          type: string
                          description: Link do quadro/arte exportado
                        confidence:
                          type: number
                          description: Confiança do OCR; ausente no texto vivo
        "400":
          description: Arquivo inválido ou formato não suportado

  /report:
    post:
      operationId: BuildReport
      summary: Gera o relatório Word no padrão da ACD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [findings]
              properties:
                language:
                  type: string
                  enum: [pt, en, es]
                findings:
                  type: object
                  properties:
                    file: { type: string }
                    subtitle: { type: string }
                    coverage: { type: string }
                    fmt: { type: string }
                    date: { type: string }
                    requester: { type: string }
                    method: { type: string }
                    report_name: { type: string }
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          location: { type: string }
                          reads: { type: string }
                          should_be: { type: string }
                          note: { type: string }
                          timecode: { type: string }
                          asset_url: { type: string }
                    consistency:
                      type: array
                      items:
                        type: object
                        properties:
                          location: { type: string }
                          reads: { type: string }
                          should_be: { type: string }
                          note: { type: string }
                          timecode: { type: string }
                          asset_url: { type: string }
                    clean:
                      type: array
                      items: { type: string }
                    coverage_notes:
                      type: array
                      items: { type: string }
      responses:
        "200":
          description: Relatório gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  file_name: { type: string }
                  content_type: { type: string }
                  content_base64: { type: string }
                  summary: { type: object }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-functions-key
      in: header

security:
  - apiKey: []
